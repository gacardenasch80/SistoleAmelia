<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Inteligente - Opción 4 (Lip-sync Natural)</title>
    <meta name="description" content="Amelia: avatar web con sincronización labial por visemas en español, parpadeo, respiración y micro-gestos en Canvas HTML5.">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #avatar-container {
            position: relative;
            width: 360px;
            max-width: 90vw;
            height: 540px;
            max-height: 65vh;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #89b4fa;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            background: #313244;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        #avatar-canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .talking#avatar-container,
        #avatar-container.talking {
            box-shadow: 0 0 35px rgba(137, 180, 250, 0.85);
            border-color: #b4befe;
        }

        #controls {
            margin-top: 20px;
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        #chat-form {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border-radius: 8px;
            border: 2px solid #45475a;
            background-color: #313244;
            color: #cdd6f4;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus {
            border-color: #89b4fa;
        }

        button {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: #b4befe;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #585b70;
            cursor: not-allowed;
            transform: none;
        }

        .btn-sec {
            background-color: #45475a;
            color: #cdd6f4;
            font-size: 13px;
            padding: 8px 14px;
        }

        .btn-outline {
            background-color: #313244;
            border: 1px solid #89b4fa;
            color: #89b4fa;
            font-size: 13px;
            padding: 8px 14px;
        }

        #status {
            margin-top: 15px;
            font-style: italic;
            color: #a6adc8;
            min-height: 40px;
            padding: 0 10px;
        }
    </style>
</head>

<body>

    <h1>Amelia - Opción 4: Lip-sync Natural</h1>

    <div id="avatar-container">
        <canvas id="avatar-canvas"></canvas>
    </div>

    <div id="controls">
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu pregunta aquí..." autocomplete="off">
            <button type="submit" id="btn-send">Enviar 🚀</button>
        </form>
        <div style="margin-top: 10px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button type="button" id="btn-test" class="btn-sec" onclick="hablar('Hola, me llamo Amelia. ¿En qué puedo ayudarte hoy?')">🔊 Probar</button>
            <button type="button" id="btn-test-labios" class="btn-sec" onclick="hablar('Mamá, papá, bebé. ¡Excelente! Tu cita está confirmada.')">👄 Probar labios</button>
            <button type="button" id="btn-framing" class="btn-outline" onclick="alternarEncuadre()">🎥 Plano: Busto</button>
            <button type="button" id="btn-api" class="btn-outline" onclick="cambiarApiKey()">🔑 Clave API</button>
        </div>
        <p id="status">Escribe una pregunta o presiona Probar. (Agrega <code>?debug</code> a la URL para calibrar.)</p>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const statusText = document.getElementById('status');
        const avatarContainer = document.getElementById('avatar-container');
        const btnFraming = document.getElementById('btn-framing');
        const canvas = document.getElementById('avatar-canvas');
        const ctx = canvas.getContext('2d');
        const GEMINI_API_KEY = localStorage.getItem('GEMINI_API_KEY') || atob('QVEuQWI4Uk42SXhBZU9xZzJSRE4zd2h1RUtFWWFNM25sMFhtQ3RHUDVUUEh1MWlFYks0dw==');

        // =====================================================================
        // PASO 2 · Geometría (coordenadas en la imagen ORIGINAL 848x1264)
        // Calibrado con recortes ampliados de Img/idle_hd.jpg y Img/talking_*.jpg
        // =====================================================================
        const SRC_W = 848, SRC_H = 1264;
        const MOUTH = { x: 442, y: 335, rx: 32, ry: 26 };          // boca (máscara difuminada)
        const EYES = [
            { x: 418, y: 281, rx: 13, ry: 6 },                      // ojo izquierdo (en pantalla)
            { x: 468, y: 285, rx: 13, ry: 6 }                       // ojo derecho
        ];
        const LID_DY = -10;                                          // franja de piel del párpado (sobre el ojo)
        const HEAD = { x: 442, y: 272, rx: 74, ry: 112 };            // cabeza (micro-movimiento)
        const MID_ALIGN = { dx: 0, dy: 2.5 };                        // talking_mid.jpg está ~2.5px más arriba
        const HIGH_ALIGN = { dx: 0, dy: 0 };
        const DEBUG = new URLSearchParams(location.search).has('debug');

        // Lienzo interno HD (2:3, igual que el contenedor 360x540)
        const W = canvas.width = 720;
        const H = canvas.height = 1080;

        // Lienzos auxiliares fuera de pantalla
        function crearCapa() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
        const maskCv = crearCapa(), mctx = maskCv.getContext('2d');   // máscara temporal
        const faceCv = crearCapa(), fctx = faceCv.getContext('2d');   // cara compuesta (boca + párpados)
        const headCv = crearCapa(), hctx = headCv.getContext('2d');   // cabeza con movimiento

        // Carga de imágenes
        const imgIdle = new Image(); imgIdle.src = 'Img/idle_hd.jpg';
        const imgMid = new Image(); imgMid.src = 'Img/talking_mid.jpg';
        const imgHigh = new Image(); imgHigh.src = 'Img/talking_hd.jpg';
        const ready = (img) => img.complete && img.naturalWidth > 0;

        // Utilidades
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

        // =====================================================================
        // PASO 3 · Cámara (encuadre de busto + zoom al hablar)
        // =====================================================================
        const CAM_IDLE = { cx: 442, cy: 380, w: 320 };   // h = w * 1.5
        const CAM_TALK = { cx: 442, cy: 352, w: 285 };
        const CAM_FULL = { cx: 424, cy: 632, w: 842 };
        let framing = 'busto';
        const cam = { ...CAM_IDLE };
        const camEff = { sx: 0, sy: 0, w: 320, h: 480, s: W / 320 };
        let camPulse = 0;

        function calcularCamEff(cx, cy, w) {
            w = Math.min(w, SRC_W, SRC_H / 1.5);
            const h = w * 1.5;
            camEff.w = w; camEff.h = h;
            camEff.sx = clamp(cx - w / 2, 0, SRC_W - w);
            camEff.sy = clamp(cy - h / 2, 0, SRC_H - h);
            camEff.s = W / w;
        }

        function srcToCanvas(x, y) {
            return { x: (x - camEff.sx) * camEff.s, y: (y - camEff.sy) * camEff.s };
        }

        // Dibuja una imagen completa con la cámara actual (align desplaza el contenido en px de origen)
        function drawCam(c, img, align) {
            const k = img.naturalWidth / SRC_W;
            const ax = align ? align.dx : 0, ay = align ? align.dy : 0;
            c.drawImage(img, (camEff.sx - ax) * k, (camEff.sy - ay) * k, camEff.w * k, camEff.h * k, 0, 0, W, H);
        }

        function alternarEncuadre() {
            framing = framing === 'busto' ? 'completo' : 'busto';
            btnFraming.innerText = framing === 'busto' ? '🎥 Plano: Busto' : '🎥 Plano: Completo';
        }

        // =====================================================================
        // PASO 4 · Capa con máscara elíptica DIFUMINADA (sin bordes)
        // =====================================================================
        function regionBBox(reg, margen) {
            const p = srcToCanvas(reg.x, reg.y), rx = reg.rx * camEff.s, ry = reg.ry * camEff.s;
            const x0 = Math.max(0, Math.floor(p.x - rx - margen)), y0 = Math.max(0, Math.floor(p.y - ry - margen));
            const x1 = Math.min(W, Math.ceil(p.x + rx + margen)), y1 = Math.min(H, Math.ceil(p.y + ry + margen));
            return { x: x0, y: y0, w: x1 - x0, h: y1 - y0, p, rx, ry };
        }

        // Aplica gradiente radial (opaco en el centro → transparente en el borde) con destination-in
        function aplicarMascara(c, b, inner) {
            c.save();
            c.beginPath(); c.rect(b.x, b.y, b.w, b.h); c.clip();
            c.globalCompositeOperation = 'destination-in';
            c.translate(b.p.x, b.p.y);
            c.scale(1, b.ry / b.rx);
            const g = c.createRadialGradient(0, 0, 0, 0, 0, b.rx);
            g.addColorStop(0, 'rgba(0,0,0,1)');
            g.addColorStop(inner, 'rgba(0,0,0,1)');
            g.addColorStop(inner + (1 - inner) * 0.5, 'rgba(0,0,0,0.55)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            c.fillStyle = g;
            const ext = b.rx * 2;
            c.fillRect(-ext, -ext, ext * 2, ext * 2);
            c.restore();
        }

        function drawMasked(target, img, reg, alpha, align, inner = 0.55) {
            if (alpha < 0.01 || !ready(img)) return;
            const b = regionBBox(reg, 3);
            if (b.w <= 0 || b.h <= 0) return;
            mctx.clearRect(b.x, b.y, b.w, b.h);
            mctx.save();
            mctx.beginPath(); mctx.rect(b.x, b.y, b.w, b.h); mctx.clip();
            drawCam(mctx, img, align);
            mctx.restore();
            aplicarMascara(mctx, b, inner);
            target.globalAlpha = alpha;
            target.drawImage(maskCv, b.x, b.y, b.w, b.h, b.x, b.y, b.w, b.h);
            target.globalAlpha = 1;
        }

        // =====================================================================
        // PASO 5 · Mandíbula continua con resorte (anti-fantasma: pares adyacentes)
        // =====================================================================
        let jawTarget = 0, jawOpen = 0, jawVel = 0;

        function dibujarBoca(c) {
            // Bandas: <0.1 cerrada | 0.3–0.58 media | >0.78 abierta. Las transiciones son breves.
            const aMid = smoothstep(0.10, 0.30, jawOpen);
            const aHigh = smoothstep(0.58, 0.78, jawOpen);
            if (aHigh < 0.99) drawMasked(c, imgMid, MOUTH, aMid, MID_ALIGN);
            drawMasked(c, imgHigh, MOUTH, aHigh, HIGH_ALIGN);
        }

        // =====================================================================
        // PASO 6 · Texto → visemas (español)
        // =====================================================================
        const VOCALES = { a: 1.0, 'á': 1.0, o: 0.85, 'ó': 0.9, e: 0.48, 'é': 0.52, i: 0.4, 'í': 0.44, u: 0.4, 'ú': 0.44, 'ü': 0.4 };
        const CONSONANTES = {
            m: 0, b: 0, p: 0, v: 0,              // labios cerrados (en español v = b)
            f: 0.08,
            l: 0.36, d: 0.35, t: 0.34, n: 0.35, s: 0.34, z: 0.34, c: 0.35, k: 0.35, q: 0.35,
            g: 0.38, j: 0.4, x: 0.36, y: 0.38, 'ñ': 0.35, r: 0.38, w: 0.4
        };
        const DUR_CONS = { m: 75, b: 70, p: 75, v: 70, r: 40 };

        function textoAVisemas(texto, rate = 1) {
            const s = texto.toLowerCase();
            const entries = [];
            let t = 0;
            const push = (open, dur, ci) => { entries.push({ t, open, ci }); t += dur / rate; };

            for (let i = 0; i < s.length; i++) {
                const c = s[i], next = s[i + 1], prev = s[i - 1];
                if (c === 'h') continue;                                            // h muda (ch se trata en 'c')
                if (c === 'u' && (prev === 'q' || (prev === 'g' && (next === 'e' || next === 'i')))) continue; // que, gue
                if (c === 'l' && next === 'l') { push(0.38, 65, i); i++; continue; }
                if (c === 'c' && next === 'h') { push(0.36, 70, i); i++; continue; }
                if (c === 'r' && next === 'r') { push(0.38, 85, i); i++; continue; }

                if (VOCALES[c] !== undefined) {
                    let o = VOCALES[c] * (0.92 + Math.random() * 0.16);
                    const diptongo = VOCALES[next] !== undefined;
                    push(clamp(o, 0, 1), diptongo ? 60 : 88, i);
                    continue;
                }
                if (CONSONANTES[c] !== undefined) { push(CONSONANTES[c], DUR_CONS[c] || 55, i); continue; }
                if (/\d/.test(c)) { push(0.4, 90, i); push(0.9, 90, i); push(0.4, 70, i); continue; }
                if (c === ' ' || c === '\n' || c === '\t') {
                    const prevOpen = entries.length ? entries[entries.length - 1].open : 0;
                    push(prevOpen * 0.5, 35, i);
                    continue;
                }
                if (c === ',' || c === ';' || c === ':') { push(0, 210, i); continue; }
                if ('.!?…'.includes(c)) { push(0, 330, i); continue; }
                // ¿ ¡ comillas, paréntesis y símbolos: sin sonido
            }
            entries.push({ t, open: 0, ci: s.length });

            // Mapa charIndex → primer visema con ci >= charIndex (para re-sincronizar con onboundary)
            const charToIdx = new Int32Array(s.length + 1);
            let k = entries.length - 1;
            for (let ci = s.length; ci >= 0; ci--) {
                while (k > 0 && entries[k - 1].ci >= ci) k--;
                charToIdx[ci] = k;
            }
            return { entries, charToIdx, total: t, texto };
        }

        // =====================================================================
        // PASO 7 · Sincronización con la voz real
        // =====================================================================
        const ANTICIPACION_MS = 40;   // los labios se adelantan levemente al sonido
        const speech = {
            active: false, timeline: null, idx: 0,
            segStart: 0, segOffset: 0, speed: 1, lastB: null,
            started: false, simulated: false, boundaries: 0
        };
        let speechSession = 0;
        let timers = [];

        function timelineTime(now) {
            return speech.segOffset + (now - speech.segStart) * speech.speed;
        }

        function iniciarTimeline(tl) {
            speech.timeline = tl;
            speech.idx = 0;
            speech.segStart = performance.now();
            speech.segOffset = 0;
            speech.lastB = null;
        }

        function onBoundary(e, tl) {
            if (speech.timeline !== tl || (e.name && e.name !== 'word')) return;
            speech.boundaries++;
            const now = performance.now();
            const ci = clamp(e.charIndex || 0, 0, tl.charToIdx.length - 1);
            const k = tl.charToIdx[ci];
            const targetT = tl.entries[k].t;

            // Adaptar velocidad con la cadencia real de la voz
            if (speech.lastB) {
                const dReal = now - speech.lastB.now, dTl = targetT - speech.lastB.t;
                if (dReal > 80 && dTl > 0) {
                    const r = clamp(dTl / dReal, 0.6, 1.7);
                    speech.speed = speech.speed * 0.6 + r * 0.4;
                }
            }
            speech.lastB = { now, t: targetT };

            // Re-sincronizar solo si la desviación es perceptible
            if (Math.abs(targetT - timelineTime(now)) > 60) {
                speech.segOffset = targetT;
                speech.segStart = now;
                speech.idx = k;
            }

            // PASO 9 · Énfasis en palabras en MAYÚSCULA
            const m = tl.texto.substr(ci).match(/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü]+/);
            if (m && m[0].length >= 2 && m[0] === m[0].toUpperCase()) nod(0.9);
        }

        function actualizarJawTarget(now) {
            const tl = speech.timeline;
            if (!tl) { jawTarget = 0; return; }
            const tm = timelineTime(now) + ANTICIPACION_MS;
            const E = tl.entries;
            if (speech.idx > 0 && E[speech.idx].t > tm) speech.idx = tl.charToIdx[0];
            while (speech.idx < E.length - 1 && E[speech.idx + 1].t <= tm) speech.idx++;
            if (tm >= tl.total) {
                // La línea de tiempo terminó pero la voz sigue: movimiento de relleno suave
                const sigueHablando = !speech.simulated && synth && synth.speaking;
                jawTarget = sigueHablando ? 0.35 + 0.3 * Math.abs(Math.sin(now * 0.016)) : 0;
            } else {
                jawTarget = E[speech.idx].open;
            }
        }

        function limpiarTexto(texto) {
            return (texto || '')
                .replace(/[*_#`>~|]/g, ' ')
                .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Divide en oraciones (evita el corte de Chrome en textos largos)
        function dividirEnFrases(texto) {
            let partes = texto.match(/[^.!?…]+(?:[.!?…]+|$)["')\]]*\s*/g) || [texto];
            const out = [];
            for (let p of partes) {
                p = p.trim();
                if (!p) continue;
                if (p.length > 220) {
                    out.push(...p.split(/(?<=,)\s+/).filter(Boolean));
                } else if (p.length < 4 && out.length) {
                    out[out.length - 1] += ' ' + p;
                } else {
                    out.push(p);
                }
            }
            return out.length ? out : [texto];
        }

        function limpiarTimers() { timers.forEach(clearTimeout); timers = []; }

        function finalizarHabla() {
            limpiarTimers();
            speech.active = false;
            speech.timeline = null;
            speech.simulated = false;
            tiltTarget = 0;
            avatarContainer.classList.remove('talking');
            userInput.disabled = false;
            btnSend.disabled = false;
            statusText.innerText = "Listo para tu siguiente pregunta.";
        }

        // Fallback sin audio (sin voces o el navegador no inicia la síntesis)
        function simularSecuencia(timelines, session) {
            speech.simulated = true;
            let i = 0;
            const siguiente = () => {
                if (session !== speechSession || !speech.simulated) return;
                if (i >= timelines.length) { finalizarHabla(); return; }
                const tl = timelines[i++];
                iniciarTimeline(tl);
                gestosDeFrase(tl.texto);
                timers.push(setTimeout(siguiente, tl.total + 180));
            };
            siguiente();
        }

        // =====================================================================
        // PASO 8 · Vida en reposo: parpadeo, respiración, micro-movimiento
        // =====================================================================
        let nextBlink = performance.now() + 2500, blinkStart = -1, dobleParpadeo = false;

        function actualizarParpadeo(now) {
            if (blinkStart < 0 && now >= nextBlink) blinkStart = now;
            if (blinkStart < 0) return 0;
            const e = now - blinkStart, C = 70, Hd = 40, O = 100;
            let c;
            if (e < C) c = e / C;
            else if (e < C + Hd) c = 1;
            else if (e < C + Hd + O) c = 1 - (e - C - Hd) / O;
            else {
                blinkStart = -1;
                if (!dobleParpadeo && Math.random() < 0.15) { dobleParpadeo = true; nextBlink = now + 120; }
                else { dobleParpadeo = false; nextBlink = now + 2000 + Math.random() * 4000; }
                return 0;
            }
            return c * c * (3 - 2 * c);
        }

        // Párpado: se estira la franja de piel sobre el ojo hacia abajo (sin assets nuevos)
        function dibujarParpados(c, closure) {
            if (closure < 0.02 || !ready(imgIdle)) return;
            const s = camEff.s, k = imgIdle.naturalWidth / SRC_W;
            for (const e of EYES) {
                const p = srcToCanvas(e.x, e.y), rx = e.rx * s, ry = e.ry * s;
                const top = p.y - ry * 1.5;
                const lidH = ry * 3.0 * closure;
                c.save();
                c.beginPath();
                c.ellipse(p.x, p.y, rx * 1.25, ry * 1.6, 0, 0, Math.PI * 2);
                c.clip();
                c.drawImage(imgIdle,
                    (e.x - e.rx * 1.3) * k, (e.y + LID_DY) * k, e.rx * 2.6 * k, 4 * k,
                    p.x - rx * 1.3, top, rx * 2.6, lidH);
                // Línea de pestañas en el borde del párpado
                const yb = top + lidH;
                c.strokeStyle = `rgba(35,25,28,${0.6 * closure})`;
                c.lineWidth = Math.max(1, 0.9 * s);
                c.beginPath();
                c.moveTo(p.x - rx * 1.05, yb - ry * 0.35);
                c.quadraticCurveTo(p.x, yb + ry * 0.35, p.x + rx * 1.05, yb - ry * 0.35);
                c.stroke();
                c.restore();
            }
        }

        const head = { dx: 0, dy: 0, rot: 0 };
        let headAmp = 0.5;

        function dibujarCabeza() {
            const b = regionBBox(HEAD, 8);
            if (b.w <= 0 || b.h <= 0) return;
            const s = camEff.s;
            const piv = srcToCanvas(HEAD.x, HEAD.y + HEAD.ry * 0.75);   // pivote en el cuello
            hctx.clearRect(b.x, b.y, b.w, b.h);
            hctx.save();
            hctx.beginPath(); hctx.rect(b.x, b.y, b.w, b.h); hctx.clip();
            hctx.translate(piv.x + head.dx * s, piv.y + head.dy * s);
            hctx.rotate(head.rot);
            hctx.translate(-piv.x, -piv.y);
            hctx.drawImage(faceCv, 0, 0);
            hctx.restore();
            aplicarMascara(hctx, b, 0.72);
            ctx.drawImage(headCv, b.x, b.y, b.w, b.h, b.x, b.y, b.w, b.h);
        }

        // =====================================================================
        // PASO 9 · Gestos de énfasis
        // =====================================================================
        let nodPos = 0, nodVel = 0, tilt = 0, tiltTarget = 0;

        function nod(fuerza = 1) { nodVel += fuerza; }

        function gestosDeFrase(frase) {
            camPulse = Math.max(camPulse, 0.012);
            const f = frase.trim();
            tiltTarget = f.endsWith('?') ? 0.014 : 0;
            if (f.endsWith('!')) nod(1.1);
            else if (Math.random() < 0.3) nod(0.5);
        }

        // =====================================================================
        // Bucle de render
        // =====================================================================
        let lastNow = performance.now(), acc = 0, fps = 60;

        function drawFrame(now) {
            const dt = clamp(now - lastNow, 1, 100);
            lastNow = now;
            fps = fps * 0.95 + (1000 / dt) * 0.05;
            const k60 = dt / 16.667;

            // Cámara
            const objetivo = framing === 'completo' ? CAM_FULL : (speech.active ? CAM_TALK : CAM_IDLE);
            const fc = 1 - Math.pow(1 - 0.035, k60);
            cam.cx += (objetivo.cx - cam.cx) * fc;
            cam.cy += (objetivo.cy - cam.cy) * fc;
            cam.w += (objetivo.w - cam.w) * fc;
            camPulse *= Math.pow(0.95, k60);
            const respiracion = Math.sin(now * 0.0013);
            calcularCamEff(cam.cx, cam.cy + respiracion * 0.8, cam.w / (1 + respiracion * 0.004 + camPulse));

            // Física a 60 Hz fija (independiente de la tasa de refresco)
            actualizarJawTarget(now);
            acc = Math.min(acc + dt, 100);
            while (acc >= 16.667) {
                jawVel += (jawTarget - jawOpen) * 0.35;
                jawVel *= 0.55;
                jawOpen = clamp(jawOpen + jawVel, 0, 1);
                nodVel += -nodPos * 0.08;
                nodVel *= 0.86;
                nodPos += nodVel;
                acc -= 16.667;
            }
            tilt += (tiltTarget - tilt) * fc;
            headAmp += ((speech.active ? 1 : 0.5) - headAmp) * fc;

            // Micro-movimiento de cabeza (suma de senos ≈ ruido suave)
            head.dx = (Math.sin(now * 0.00071) + 0.6 * Math.sin(now * 0.00173 + 1.3)) * 0.7 * headAmp;
            head.dy = (Math.sin(now * 0.00059 + 0.7) + 0.5 * Math.sin(now * 0.00149)) * 0.5 * headAmp + nodPos;
            head.rot = (Math.sin(now * 0.00047 + 2) + 0.5 * Math.sin(now * 0.00121)) * 0.0045 * headAmp + tilt;

            const closure = actualizarParpadeo(now);

            if (ready(imgIdle)) {
                // 1. Fondo / cuerpo
                ctx.globalAlpha = 1;
                drawCam(ctx, imgIdle);

                // 2. Cara compuesta (idle + boca + párpados) en su región
                const fb = regionBBox(HEAD, 16);
                fctx.clearRect(fb.x, fb.y, fb.w, fb.h);
                fctx.save();
                fctx.beginPath(); fctx.rect(fb.x, fb.y, fb.w, fb.h); fctx.clip();
                drawCam(fctx, imgIdle);
                fctx.restore();
                dibujarBoca(fctx);
                dibujarParpados(fctx, closure);

                // 3. Cabeza con micro-movimiento y borde difuminado
                dibujarCabeza();

                if (DEBUG) dibujarDebug(closure);
            }
            requestAnimationFrame(drawFrame);
        }

        function dibujarDebug(closure) {
            ctx.save();
            ctx.lineWidth = 2;
            const s = camEff.s;
            const ell = (r, col) => {
                const p = srcToCanvas(r.x, r.y);
                ctx.strokeStyle = col;
                ctx.beginPath(); ctx.ellipse(p.x, p.y, r.rx * s, r.ry * s, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = col;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
            };
            ell(MOUTH, '#f38ba8');
            EYES.forEach(e => ell(e, '#a6e3a1'));
            ell(HEAD, '#f9e2af');
            ctx.fillStyle = 'rgba(17,17,27,0.78)';
            ctx.fillRect(10, 10, 360, 168);
            ctx.fillStyle = '#cdd6f4';
            ctx.font = '20px monospace';
            ctx.fillText(`FPS: ${fps.toFixed(0)}  jaw: ${jawOpen.toFixed(2)}→${jawTarget.toFixed(2)}`, 20, 38);
            ctx.fillText(`speed: ${speech.speed.toFixed(2)}  boundaries: ${speech.boundaries}`, 20, 64);
            ctx.fillText(`parpadeo: ${closure.toFixed(2)}  sim: ${speech.simulated}`, 20, 90);
            ctx.fillText(`cam: ${camEff.sx.toFixed(0)},${camEff.sy.toFixed(0)} w${camEff.w.toFixed(0)}`, 20, 116);
            ctx.fillStyle = '#45475a'; ctx.fillRect(20, 132, 330, 24);
            ctx.fillStyle = '#89b4fa'; ctx.fillRect(20, 132, 330 * jawOpen, 24);
            ctx.restore();
        }

        // En modo debug: clic en el canvas muestra la coordenada en la imagen original
        if (DEBUG) {
            canvas.addEventListener('click', (ev) => {
                const r = canvas.getBoundingClientRect();
                const esc = Math.max(r.width / W, r.height / H);
                const ox = (r.width - W * esc) / 2, oy = (r.height - H * esc) / 2;
                const px = (ev.clientX - r.left - ox) / esc, py = (ev.clientY - r.top - oy) / esc;
                const sx = px / camEff.s + camEff.sx, sy = py / camEff.s + camEff.sy;
                statusText.innerText = `🎯 Coordenada en imagen original: x=${sx.toFixed(0)}, y=${sy.toFixed(0)}`;
                console.log('Coordenada origen:', Math.round(sx), Math.round(sy));
            });
        }

        requestAnimationFrame(drawFrame);

        // Síntesis de voz
        const synth = window.speechSynthesis;
        let vocesDisponibles = [];
        function cargarVoces() {
            if (synth) {
                vocesDisponibles = synth.getVoices();
            }
        }
        cargarVoces();
        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = cargarVoces;
        }

        function seleccionarVozFemeninaLatina(voces) {
            if (!voces || voces.length === 0) return null;

            const nombresMasculinos = ['jorge', 'pablo', 'raul', 'julio', 'miguel', 'carlos', 'mateo', 'tomas', 'alonso', 'enrique', 'david', 'male', 'hombre'];
            const nombresFemeninosLatinos = ['sabina', 'dalia', 'salome', 'paulina', 'sofia', 'sofi', 'camila', 'jimena', 'hilda', 'lupe', 'francisca', 'zaira', 'paloma', 'monica', 'luz', 'google español', 'helena', 'elena'];
            const codigosLatinos = ['es-co', 'es-mx', 'es-us', 'es-ar', 'es-cl', 'es-pe', 'es-419'];

            let voz = voces.find(v => {
                const lang = v.lang.toLowerCase();
                const name = v.name.toLowerCase();
                const esLatino = codigosLatinos.some(code => lang.includes(code));
                const esFemenina = nombresFemeninosLatinos.some(nom => name.includes(nom));
                const esMasculino = nombresMasculinos.some(nom => name.includes(nom));
                return esLatino && esFemenina && !esMasculino;
            });
            if (voz) return voz;

            voz = voces.find(v => {
                const lang = v.lang.toLowerCase();
                const name = v.name.toLowerCase();
                const esLatino = codigosLatinos.some(code => lang.includes(code));
                const esMasculino = nombresMasculinos.some(nom => name.includes(nom));
                return esLatino && !esMasculino;
            });
            if (voz) return voz;

            voz = voces.find(v => {
                const lang = v.lang.toLowerCase();
                const name = v.name.toLowerCase();
                const esEspanol = lang.startsWith('es');
                const esMasculino = nombresMasculinos.some(nom => name.includes(nom));
                return esEspanol && !esMasculino;
            });
            if (voz) return voz;

            return voces.find(v => v.lang.toLowerCase().startsWith('es')) || null;
        }

        const RATE = 1.0;

        function hablar(textoOriginal) {
            const session = ++speechSession;
            if (synth) synth.cancel();
            limpiarTimers();

            const texto = limpiarTexto(textoOriginal);
            if (!texto) { finalizarHabla(); return; }

            const frases = dividirEnFrases(texto);
            const timelines = frases.map(f => textoAVisemas(f, RATE));
            const totalEstimado = timelines.reduce((a, tl) => a + tl.total, 0);

            speech.active = true;
            speech.timeline = null;
            speech.started = false;
            speech.simulated = false;
            speech.speed = 1;
            speech.boundaries = 0;
            avatarContainer.classList.add('talking');
            statusText.innerText = "El avatar está respondiendo...";

            if (!synth) { simularSecuencia(timelines, session); return; }

            try {
                const vozLatina = seleccionarVozFemeninaLatina(vocesDisponibles);
                frases.forEach((frase, i) => {
                    const tl = timelines[i];
                    const u = new SpeechSynthesisUtterance(frase);
                    if (vozLatina) { u.voice = vozLatina; u.lang = vozLatina.lang; }
                    else { u.lang = 'es-MX'; }
                    u.rate = RATE;

                    u.onstart = () => {
                        if (session !== speechSession) return;
                        if (speech.simulated) { limpiarTimers(); speech.simulated = false; programarSeguridad(session, totalEstimado); }
                        speech.started = true;
                        iniciarTimeline(tl);
                        gestosDeFrase(frase);
                    };
                    u.onboundary = (e) => {
                        if (session !== speechSession) return;
                        onBoundary(e, tl);
                    };
                    u.onend = () => {
                        if (session !== speechSession) return;
                        if (i === frases.length - 1) finalizarHabla();
                        else if (speech.timeline === tl) speech.timeline = null;   // boca cerrada entre frases
                    };
                    u.onerror = (e) => {
                        if (session !== speechSession) return;
                        if (e.error === 'interrupted' || e.error === 'canceled') return;
                        console.warn('SpeechSynthesis error:', e.error);
                        finalizarHabla();
                    };
                    synth.speak(u);
                });

                // Si la voz no arranca en 2 s, animar igual (sin audio)
                timers.push(setTimeout(() => {
                    if (session === speechSession && !speech.started) simularSecuencia(timelines, session);
                }, 2000));
                programarSeguridad(session, totalEstimado);
            } catch (err) {
                console.warn("SpeechSynthesis error:", err);
                simularSecuencia(timelines, session);
            }
        }

        // Seguro por si onend nunca llega (bug conocido de Chrome)
        function programarSeguridad(session, totalEstimado) {
            timers.push(setTimeout(() => {
                if (session === speechSession && speech.active) {
                    if (synth && synth.speaking) { programarSeguridad(session, 3000); return; }
                    finalizarHabla();
                }
            }, totalEstimado * 1.6 + 4000));
        }

        function getActiveApiKey() {
            const activeNewKey = atob('QVEuQWI4Uk42S0RzbUtfWS01TjBwYjk0RTd2dTRGWVQ5OXVKVjN0WmlCVHJWTGJRU1dxRXc=');
            const saved = localStorage.getItem('GEMINI_API_KEY');
            if (!saved || saved.includes('AQ.Ab8RN6IxAe')) {
                localStorage.removeItem('GEMINI_API_KEY');
                return activeNewKey;
            }
            return saved;
        }

        function cambiarApiKey() {
            const actual = getActiveApiKey();
            const nueva = prompt("🔑 Ingresa tu API Key de Google AI Studio (empieza por AIzaSy...):\n\nSi no tienes una, créala gratis en: https://aistudio.google.com/app/apikey", actual);
            if (nueva && nueva.trim()) {
                localStorage.setItem('GEMINI_API_KEY', nueva.trim());
                alert("✅ API Key guardada correctamente.");
                statusText.innerText = "API Key actualizada. Haz tu pregunta.";
            }
        }

        async function consultarGemini(preguntaUsuario) {
            const rawKey = getActiveApiKey();
            const modelos = ['gemini-2.5-flash', 'gemini-3.6-flash', 'gemini-flash-latest', 'gemini-3.5-flash'];

            const ahoraColombia = new Date().toLocaleString('es-CO', {
                timeZone: 'America/Bogota',
                dateStyle: 'full',
                timeStyle: 'short'
            });

            const promptContexto = `Información de contexto en tiempo real: La fecha y hora actual exacta en Colombia es ${ahoraColombia}.
Actúa como un asistente virtual interactivo conversacional muy amigable, simpático y expresivo. Tus respuestas deben ser sumamente breves y directas (máximo 2 frases u oraciones cortas), ya que tu respuesta será leída en voz alta por un avatar y no queremos aburrir al usuario. Da siempre datos precisos usando el contexto y nunca uses corchetes ni texto comodín. Responde de forma natural a esto: "${preguntaUsuario}"`;

            const payload = {
                contents: [{
                    parts: [{ text: promptContexto }]
                }]
            };

            let ultimoError = '';

            for (const model of modelos) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${rawKey}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                            const partConTexto = data.candidates[0].content.parts.find(p => p.text);
                            if (partConTexto && partConTexto.text) {
                                return partConTexto.text;
                            }
                        }
                    } else {
                        const errJson = await response.json().catch(() => ({}));
                        ultimoError = `HTTP ${response.status}: ${errJson.error?.message || response.statusText}`;
                        console.warn(`Intento fallido con ${model}:`, ultimoError);
                    }
                } catch (err) {
                    ultimoError = err.message || 'Error de conexión de red';
                    console.warn(`Error de red con ${model}:`, err);
                }
            }

            if (ultimoError.includes("401") || ultimoError.includes("UNAUTHENTICATED") || ultimoError.includes("API_KEY_SERVICE_BLOCKED")) {
                setTimeout(() => {
                    if (confirm("⚠️ La clave de API de Gemini devolvió Error 401 (Credenciales bloqueadas por Google).\n\n¿Deseas ingresar tu clave de API gratuita de Google AI Studio?")) {
                        cambiarApiKey();
                    }
                }, 400);
            }

            throw new Error(`Error en API Gemini (${ultimoError}). Haz clic en '🔑 Clave API' para actualizarla.`);
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const mensajeUsuario = userInput.value.trim();
            if (!mensajeUsuario) return;

            userInput.disabled = true;
            btnSend.disabled = true;
            statusText.innerText = `Pensando respuesta para: "${mensajeUsuario}"...`;

            try {
                const respuestaIA = await consultarGemini(mensajeUsuario);
                if (respuestaIA) {
                    userInput.value = '';
                    hablar(respuestaIA);
                }
            } catch (err) {
                console.error("Error al consultar Gemini:", err);
                statusText.innerText = `⚠️ ${err.message}`;
                userInput.disabled = false;
                btnSend.disabled = false;
            }
        });
    </script>
