<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Inteligente - Opción 1 (Corte Instantáneo)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #avatar-container {
            position: relative;
            width: 360px;
            max-width: 90vw;
            height: 540px;
            max-height: 65vh;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #89b4fa;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            background: #313244;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: none;
            pointer-events: none;
        }

        .avatar-img.active {
            opacity: 1;
        }

        .talking#avatar-container,
        #avatar-container.talking {
            box-shadow: 0 0 35px rgba(137, 180, 250, 0.85);
            border-color: #b4befe;
        }

        #controls {
            margin-top: 20px;
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        #chat-form {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border-radius: 8px;
            border: 2px solid #45475a;
            background-color: #313244;
            color: #cdd6f4;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus {
            border-color: #89b4fa;
        }

        button {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: #b4befe;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #585b70;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 15px;
            font-style: italic;
            color: #a6adc8;
            min-height: 40px;
            padding: 0 10px;
        }
    </style>
</head>

<body>

    <h1>Amelia - Opción 1: Corte Instantáneo (Cartoon/2D)</h1>

    <div id="avatar-container">
        <!-- Imagen de reposo (boca cerrada) -->
        <img id="avatar-idle" class="avatar-img active" src="Img/idle_hd.jpg" alt="Idle">
        <!-- Imagen habla intermedia (boca media) -->
        <img id="avatar-talking-mid" class="avatar-img" src="Img/talking_mid.jpg" alt="Talking Mid">
        <!-- Imagen habla abierta (boca abierta) -->
        <img id="avatar-talking-high" class="avatar-img" src="Img/talking_hd.jpg" alt="Talking High">
    </div>

    <div id="controls">
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu pregunta aquí..." autocomplete="off" required>
            <button type="submit" id="btn-send">Enviar 🚀</button>
        </form>
        <p id="status">Escribe una pregunta y presiona Enviar.</p>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const statusText = document.getElementById('status');
        const avatarContainer = document.getElementById('avatar-container');
        const avatarIdle = document.getElementById('avatar-idle');
        const avatarTalkingMid = document.getElementById('avatar-talking-mid');
        const avatarTalkingHigh = document.getElementById('avatar-talking-high');
        const GEMINI_API_KEY = localStorage.getItem('GEMINI_API_KEY') || atob('QVEuQWI4Uk42SXhBZU9xZzJSRE4zd2h1RUtFWWFNM25sMFhtQ3RHUDVUUEh1MWlFYks0dw==');

        // 1. Precarga de imágenes en memoria (Visemas)
        const imgIdlePreload = new Image();
        imgIdlePreload.src = 'Img/idle_hd.jpg';
        const imgTalkingMidPreload = new Image();
        imgTalkingMidPreload.src = 'Img/talking_mid.jpg';
        const imgTalkingHighPreload = new Image();
        imgTalkingHighPreload.src = 'Img/talking_hd.jpg';

        // Control de estado de la boca
        function setAvatarMouthState(state) {
            // state: 'idle' | 'mid' | 'high'
            avatarIdle.classList.toggle('active', state === 'idle');
            avatarTalkingMid.classList.toggle('active', state === 'mid');
            avatarTalkingHigh.classList.toggle('active', state === 'high');
        }

        let lipSyncTimer = null;
        let lipSyncTimeout = null;

        function iniciarLipSync(texto) {
            detenerLipSync();

            const duracionEstimada = Math.max(3500, (texto || '').length * 80);

            const visemaSecuencia = ['mid', 'high', 'mid', 'high', 'idle', 'mid', 'high', 'mid', 'high', 'high', 'mid', 'idle'];
            let step = 0;

            avatarContainer.classList.add('talking');
            statusText.innerText = "El avatar está respondiendo...";

            lipSyncTimer = setInterval(() => {
                if (Math.random() < 0.08) {
                    setAvatarMouthState('idle'); // Micro-pausa entre palabras
                } else {
                    setAvatarMouthState(visemaSecuencia[step % visemaSecuencia.length]);
                    step++;
                }
            }, 90);

            lipSyncTimeout = setTimeout(() => {
                detenerLipSync();
            }, duracionEstimada);
        }

        function detenerLipSync() {
            if (lipSyncTimer) {
                clearInterval(lipSyncTimer);
                lipSyncTimer = null;
            }
            if (lipSyncTimeout) {
                clearTimeout(lipSyncTimeout);
                lipSyncTimeout = null;
            }
            avatarContainer.classList.remove('talking');
            setAvatarMouthState('idle');
        }

        // 2. Inicialización rápida de síntesis de voz
        const synth = window.speechSynthesis;
        let vocesDisponibles = [];
        function cargarVoces() {
            if (synth) {
                vocesDisponibles = synth.getVoices();
            }
        }
        cargarVoces();
        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = cargarVoces;
        }

        function seleccionarVozFemeninaLatina(voces) {
            if (!voces || voces.length === 0) return null;

            const nombresMasculinos = ['jorge', 'pablo', 'raul', 'julio', 'miguel', 'carlos', 'mateo', 'tomas', 'alonso', 'enrique', 'david', 'male', 'hombre'];
            const nombresFemeninosLatinos = ['sabina', 'dalia', 'salome', 'paulina', 'sofia', 'sofi', 'camila', 'jimena', 'hilda', 'lupe', 'francisca', 'zaira', 'paloma', 'monica', 'luz', 'google español', 'helena', 'elena'];
            const codigosLatinos = ['es-co', 'es-mx', 'es-us', 'es-ar', 'es-cl', 'es-pe', 'es-419'];

            // 1. Voz latina con nombre femenino reconocido
            let voz = voces.find(v => {
                const lang = v.lang.toLowerCase();
                const name = v.name.toLowerCase();
                const esLatino = codigosLatinos.some(code => lang.includes(code));
                const esFemenina = nombresFemeninosLatinos.some(nom => name.includes(nom));
                const esMasculino = nombresMasculinos.some(nom => name.includes(nom));
                return esLatino && esFemenina && !esMasculino;
            });
            if (voz) return voz;

            // 2. Cualquier voz de región latina no masculina
            voz = voces.find(v => {
                const lang = v.lang.toLowerCase();
                const name = v.name.toLowerCase();
                const esLatino = codigosLatinos.some(code => lang.includes(code));
                const esMasculino = nombresMasculinos.some(nom => name.includes(nom));
                return esLatino && !esMasculino;
            });
            if (voz) return voz;

            // 3. Cualquier voz en español no masculina
            voz = voces.find(v => {
                const lang = v.lang.toLowerCase();
                const name = v.name.toLowerCase();
                const esEspanol = lang.startsWith('es');
                const esMasculino = nombresMasculinos.some(nom => name.includes(nom));
                return esEspanol && !esMasculino;
            });
            if (voz) return voz;

            // 4. Fallback a cualquier voz en español
            return voces.find(v => v.lang.toLowerCase().startsWith('es')) || null;
        }

        function hablar(texto) {
            if (synth && synth.speaking) {
                synth.cancel();
            }

            iniciarLipSync(texto);

            try {
                const utterance = new SpeechSynthesisUtterance(texto);
                const vozLatina = seleccionarVozFemeninaLatina(vocesDisponibles);

                if (vozLatina) {
                    utterance.voice = vozLatina;
                    utterance.lang = vozLatina.lang;
                } else {
                    utterance.lang = 'es-MX';
                }

                utterance.onend = () => {
                    userInput.disabled = false;
                    btnSend.disabled = false;
                    statusText.innerText = "Listo para tu siguiente pregunta.";
                };

                utterance.onerror = () => {
                    userInput.disabled = false;
                    btnSend.disabled = false;
                    statusText.innerText = "Listo para tu siguiente pregunta.";
                };

                synth.speak(utterance);
            } catch (err) {
                console.warn("SpeechSynthesis error:", err);
                userInput.disabled = false;
                btnSend.disabled = false;
            }
        }

        async function consultarGemini(preguntaUsuario) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${GEMINI_API_KEY}`;

            const ahoraColombia = new Date().toLocaleString('es-CO', {
                timeZone: 'America/Bogota',
                dateStyle: 'full',
                timeStyle: 'short'
            });

            const promptContexto = `Información de contexto en tiempo real: La fecha y hora actual exacta en Colombia es ${ahoraColombia}.
Actúa como un asistente virtual interactivo conversacional muy amigable, simpático y expresivo. Tus respuestas deben ser sumamente breves y directas (máximo 2 frases u oraciones cortas), ya que tu respuesta será leída en voz alta por un avatar y no queremos aburrir al usuario. Da siempre datos precisos usando el contexto y nunca uses corchetes ni texto comodín. Responde de forma natural a esto: "${preguntaUsuario}"`;

            const payload = {
                contents: [{
                    parts: [{
                        text: promptContexto
                    }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Error en la API: ${response.statusText}`);
                }

                const data = await response.json();
                return data.candidates[0].content.parts[0].text;

            } catch (error) {
                console.error("Error al consultar Gemini:", error);
                return "Tuve un problema de conexión con mi cerebro artificial. ¿Podrías repetirme la pregunta?";
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const mensajeUsuario = userInput.value.trim();
            if (!mensajeUsuario) return;

            userInput.disabled = true;
            btnSend.disabled = true;
            statusText.innerText = `Pensando respuesta para: "${mensajeUsuario}"...`;

            const respuestaIA = await consultarGemini(mensajeUsuario);

            if (respuestaIA) {
                userInput.value = '';
                hablar(respuestaIA);
            } else {
                userInput.disabled = false;
                btnSend.disabled = false;
            }
        });
    </script>
</body>

</html>
